<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Суточный рапорт — демо</title><style>body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:22px;color:#172333}.app{max-width:520px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 4px 22px #0001}h1{font-size:25px}p{line-height:1.5;color:#526071}.btn{display:block;text-align:center;background:#1769d2;color:white;border-radius:12px;padding:16px;margin:18px 0;font-weight:bold;cursor:pointer}input{display:none}img{width:100%;border-radius:12px;display:none}small{color:#64748b}</style></head><body><main class="app"><h1>📋 Суточный рапорт</h1><p>Демонстрационная версия. Сфотографируйте бумажный рапорт или выберите готовую фотографию.</p><label class="btn" for="photo">📷 Сфотографировать рапорт</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" alt="Фотография рапорта"><p id="status">Фотография ещё не выбрана.</p><small>На этом этапе снимок остаётся на вашем устройстве. Распознавание и экспорт в Excel будут добавлены позже.</small></main><script>document.getElementById('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=document.getElementById('preview');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url=URL.createObjectURL(f);img.src=img.dataset.url;img.style.display='block';document.getElementById('status').textContent='Фото загружено. Следующий этап — распознавание.';});</script></body></html>
